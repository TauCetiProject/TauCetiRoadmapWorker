[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tauceti-roadmap-worker"
version = "0.1.0"
description = "Operator harness that plans, reviews and ports Tau Ceti roadmaps through a job board"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Standard library only: TOML is read with tomllib (Python 3.11+). The sources service extracts PDF
# text with `pdftotext -layout` when poppler is installed, else with the optional `pdf` extra; OCR of
# image-only scans needs the optional `ocr` extra (the RapidOCR recipe: ONNX runtime, pypdfium2 for
# rendering, headless OpenCV). rapidocr-onnxruntime requires opencv-python, which needs libGL and
# fails to load on a headless server; it is excluded in favour of opencv-python-headless, here for
# installs from a checkout and by `--excludes ocr-excludes.txt` for `uv tool install` from git
# (a package's own [tool.uv] settings do not apply when it is installed from elsewhere).
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
ocr = ["rapidocr-onnxruntime>=1.3", "pypdfium2>=4", "opencv-python-headless>=4.5.1.48", "numpy", "pillow"]

[tool.uv]
exclude-dependencies = ["opencv-python"]

[project.scripts]
tauceti-roadmap = "tauceti_roadmap_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

# The briefs live at the repository root (prompts/) so that they are easy to review and
# CODEOWNERS-protected; the wheel bundles them into the package so that paths.HERE / "prompts"
# resolves the same way in a checkout and in an installed tool.
[tool.hatch.build.targets.wheel]
packages = ["tauceti_roadmap_worker"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "tauceti_roadmap_worker/prompts"
".github/ISSUE_TEMPLATE" = "tauceti_roadmap_worker/issue_templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 120
